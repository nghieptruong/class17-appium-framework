plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.45.0")
    // Source: https://mvnrepository.com/artifact/org.testng/testng
    implementation("org.testng:testng:7.12.0")
}

test {
    useTestNG() {
        useDefaultListeners = true //dùng để tạoreport testNG
        outputDirectory = file("$projectDir/testoutput") // folder chứa testNG report
    }
}